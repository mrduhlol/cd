[[allowlists]]
description = "Synthetic diagnostics redaction test string"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ["^abc_DEF\\-0123456789$"]
paths = ["^scripts/v2\\-browser\\-diagnostics\\.test\\.mjs$"]

[[allowlists]]
description = "Recorded source SHA-256, not a credential"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ["^a63672d9fa7ad85731dd34e326ffe4ecedd2a271e460b8e94f3efdae894cb269$"]
paths = ["^docs/measurements/transfer\\-speed\\-2026\\-10\\-18/provenance\\.json$"]
